<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Corridor Lights</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0f12;
        --fg: #f2efe7;
        --muted: #a9a396;
        --line: #35312b;
        --accent: #d6b25e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 0%, rgba(214, 178, 94, 0.12), transparent 34rem),
          linear-gradient(180deg, #17181b 0%, var(--bg) 100%);
        color: var(--fg);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      main {
        width: min(40rem, calc(100vw - 3rem));
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 3rem 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      h1 {
        margin: 0 0 1rem;
        color: var(--fg);
        font-size: clamp(2.4rem, 8vw, 5.25rem);
        font-weight: 700;
        letter-spacing: 0;
        line-height: 0.95;
      }

      .mark {
        margin-bottom: 1.25rem;
        color: var(--accent);
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main aria-label="Corridor Lights placeholder">
      <div class="mark">Beautiful Demons</div>
      <h1>Corridor Lights</h1>
      <p>The door is being fitted. The lights are warming up.</p>
    </main>
  </body>
</html>
